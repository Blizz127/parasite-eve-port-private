# NON_MATCHING overlay leaves: functionally equivalent C, not byte-exact.
# The overlay YAML keeps these spans as `asm`, so the exact rebuild is unchanged.
# tools/analysis/gen_overlay_ports.py emits a native TU for each from
# src/nonmatching/overlays/<ovl>/<name>.c; the runtime registry still keys it to
# the retail bytes (FNV-1a over the span), and tools/analysis/e21_diff.py
# differential-tests it against the retail asm (RAM, scratchpad, calls, v0).
#   - [overlay, name, file_offset, file_size]
leaves:
  - [room_m0156i, func_8018F058, 0x70, 0x11D8]   # particle emitter; mode 2 register allocation differs
  - [room_m0156i, func_80192208, 0x3220, 0x7E0]   # debris effect (m0156i / m0380i)
  - [room_m0156i, func_80191B94, 0x2BAC, 0x674]   # debris particle callback (m0156i / m0380i)
# Directed differential inputs (seed k takes the k-th combination; see e21_diff.py).
inputs:
